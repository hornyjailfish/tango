id = "20261028221027__version_to_image_hash"
name = "version-to-image-hash"
source_schema_hash = "ad301433f67ec7108b54797ac5d7a61df8c92f62fa52ae631da3f49731576ac3"
target_schema_hash = "1d7a6771c1fdd999b497fc02413847f7949a879e02e1c3a3b0b1a5313bbe381e"
compatibility = "phased"
renames = []

[[steps]]
id = "apply_expand_schema"
phase = "start"
kind = "apply_files"
files = [
    "database/schema/markers.surql",
    "database/schema/schema.surql",
    "database/schema/shop-search.surql",
]

# SCHEMAFULL: legacy `version` keys on rows break UPDATE after the field is gone.
# Rebuild each row with CONTENT (drops version); image_hash VALUE fills from file bytes.
[[steps]]
id = "backfill_image_hash"
phase = "start"
kind = "run_sql"
sql = """
FOR $r IN (SELECT * FROM marker_views) {
	UPDATE $r.id CONTENT {
		marker: $r.marker,
		image_url: $r.image_url,
		content_type: $r.content_type,
		created_at: $r.created_at
	};
};
"""

# Same for queue: drop version_snapshot key, set hash_snapshot from view, re-pend.
[[steps]]
id = "backfill_queue_hash_snapshot"
phase = "start"
kind = "run_sql"
sql = """
FOR $q IN (SELECT * FROM embedding_queue) {
	LET $hash = IF $q.data != NONE {
		(SELECT VALUE image_hash FROM ONLY $q.data)
	} ELSE {
		NONE
	};
	UPDATE $q.id CONTENT {
		data: $q.data,
		hash_snapshot: $hash,
		status: 'pending',
		error_message: NONE,
		updated_at: time::now()
	};
};
"""

[[steps]]
id = "assert_views_hashed"
phase = "start"
kind = "assert_sql"
sql = "RETURN count(SELECT * FROM marker_views WHERE image_url != NONE AND image_hash = NONE);"
expect = "0"

# Field defs already absent after expand; REMOVE is idempotent cleanup.
[[steps]]
id = "drop_legacy_version_fields"
phase = "complete"
kind = "run_sql"
sql = """
REMOVE FIELD IF EXISTS version ON marker_views;
REMOVE FIELD IF EXISTS version_snapshot ON embedding_queue;
"""

